<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>家庭相片數位典藏</title>
  <style>
    :root{
      --bg:#0b0c10; --panel:#12141b; --text:#e9edf1; --muted:#a7b0bb;
      --line:#2a2f3a; --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:16px; --mono: ui-monospace, Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:var(--sans); background:linear-gradient(180deg,#07080b, #0b0c10 30%, #0b0c10); color:var(--text);}
    header{position:sticky; top:0; z-index:10; backdrop-filter: blur(10px);
      background: rgba(11,12,16,.75); border-bottom:1px solid rgba(255,255,255,.06);}
    .wrap{max-width:1200px; margin:0 auto; padding:14px 16px;}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
    h1{font-size:16px; margin:0; letter-spacing:.5px}
    .badge{font-family:var(--mono); font-size:12px; color:var(--muted); border:1px solid rgba(255,255,255,.10);
      padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.03);}
    .panel{background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08); border-radius:var(--radius); box-shadow:var(--shadow);}
    input[type="text"]{width:100%; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03); color:var(--text); outline:none;}
    .content{max-width:1200px; margin:14px auto 40px; padding:0 16px;}
    .grid{display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; padding:14px;}
    @media (max-width: 900px){ .grid{grid-template-columns: repeat(2, 1fr);} }
    @media (max-width: 520px){ .grid{grid-template-columns: 1fr;} }
    .card{overflow:hidden; border-radius:14px; border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03); cursor:pointer; display:flex; flex-direction:column;}
    .thumb{height:200px; background:#0f1117; display:flex; align-items:center; justify-content:center;}
    .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
    .meta{padding:10px 10px 12px;}
    .title{font-size:14px; line-height:1.3; margin:0 0 6px 0;}
    .sub{font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap;}
    .k{display:inline-flex; gap:6px; align-items:center}
    .k span{font-family:var(--mono); font-size:11px; padding:2px 6px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);}
    .small{color:var(--muted); font-size:12px; line-height:1.5}
    footer{color:var(--muted); font-size:12px; padding:16px; text-align:center}

    /* modal */
    .modal{position:fixed; inset:0; background:rgba(0,0,0,.68); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
    .modal.on{display:flex;}
    .modalBox{width:min(1100px, 100%); max-height: 92vh; overflow:auto;
      background: linear-gradient(180deg, rgba(23,26,34,.95), rgba(18,20,27,.95));
      border:1px solid rgba(255,255,255,.10); border-radius:18px; box-shadow:var(--shadow);}
    .modalHead{display:flex; justify-content:space-between; align-items:center;
      padding:12px 14px; border-bottom:1px solid rgba(255,255,255,.08);
      position:sticky; top:0; background: rgba(18,20,27,.92); backdrop-filter: blur(10px);}
    .btn{padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05); color:var(--text); cursor:pointer;}
    .detail{display:grid; grid-template-columns: 1.1fr .9fr; gap:14px; padding:14px;}
    @media (max-width: 980px){ .detail{grid-template-columns:1fr;} }
    .preview{border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,.10); background:#0f1117;}
    .preview img{width:100%; height:100%; max-height:70vh; object-fit:contain; display:block; background:#0f1117;}
    .kv{display:grid; grid-template-columns: 120px 1fr; gap:8px 12px; font-size:13px; align-items:start;}
    .kv div{padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.08)}
    .kv .key{color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="row">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <h1>家庭相片數位典藏</h1>
          <div class="badge" id="countBadge">0 items</div>
        </div>
        <div style="min-width:240px; flex:1; max-width:520px;">
          <input id="search" type="text" placeholder="搜尋：題名 / 描述 / 地點 / 人物 / 關鍵字…" />
        </div>
      </div>
      <div class="small" style="margin-top:10px;">
        觀眾版（唯讀）。
      </div>
    </div>
  </header>

  <div class="content">
    <div class="panel">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modalBox">
      <div class="modalHead">
        <div id="mTitle" style="font-size:14px;">檢視</div>
        <button class="btn" id="mClose">關閉</button>
      </div>
      <div class="detail">
        <div class="preview"><img id="mImg" alt=""></div>
        <div>
          <div class="kv" id="mKV"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>© 展場使用｜手機掃碼瀏覽</footer>

<script>
(async function(){
  const el = (id)=>document.getElementById(id);
  const grid = el("grid");
  const search = el("search");
  const countBadge = el("countBadge");

  const modal = el("modal");
  const mClose = el("mClose");
  const mTitle = el("mTitle");
  const mImg = el("mImg");
  const mKV = el("mKV");

  let items = [];

  function escapeHtml(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function norm(s){ return (s||"").toString().toLowerCase(); }
  function matches(it,q){
    if(!q) return true;
    const bag = [it.title,it.date,it.place,it.people,it.tags,it.desc,it.source,it.rights,it.note].map(norm).join(" ");
    return bag.includes(q);
  }
  function summarize(it){
    return {
      title: (it.title||"").trim() || "（未命名）",
      date: it.date || "未填日期",
      place: (it.place||"").trim() || "未填地點",
    };
  }

  function openModal(it){
    const s = summarize(it);
    mTitle.textContent = s.title;
    mImg.src = it.imageDataUrl || "";
    mImg.alt = s.title;

    const rows = [
      ["題名 Title", it.title],
      ["日期 Date", it.date],
      ["地點 Place", it.place],
      ["人物 People", it.people],
      ["關鍵字 Tags", it.tags],
      ["事件/描述 Description", it.desc],
      ["來源 Source", it.source],
      ["權利 Rights", it.rights],
      ["備註 Note", it.note],
    ];
    mKV.innerHTML = rows.map(([k,v]) => `
      <div class="key">${escapeHtml(k)}</div>
      <div>${escapeHtml(v||"")}</div>
    `).join("");
    modal.classList.add("on");
  }
  function closeModal(){ modal.classList.remove("on"); }

  function render(){
    const q = norm(search.value).trim();
    const filtered = items
      .filter(it => matches(it, q))
      .sort((a,b)=> (b.updatedAt||"").localeCompare(a.updatedAt||""));

    countBadge.textContent = `${items.length} items`;
    grid.innerHTML = "";

    if(filtered.length === 0){
      const d = document.createElement("div");
      d.style.padding="18px";
      d.style.color="var(--muted)";
      d.style.gridColumn="1 / -1";
      d.textContent = items.length===0 ? "尚未載入資料（data.json）。" : "沒有符合搜尋條件的結果。";
      grid.appendChild(d);
      return;
    }

    for(const it of filtered){
      const s = summarize(it);
      const card = document.createElement("div");
      card.className = "card";

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      if(it.imageDataUrl){
        const img = document.createElement("img");
        img.src = it.imageDataUrl; img.alt = s.title;
        thumb.appendChild(img);
      }else{
        const ph = document.createElement("div");
        ph.style.color="var(--muted)";
        ph.style.fontFamily="var(--mono)";
        ph.textContent="no image";
        thumb.appendChild(ph);
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `
        <p class="title">${escapeHtml(s.title)}</p>
        <div class="sub">
          <span class="k"><span>Date</span> ${escapeHtml(s.date)}</span>
          <span class="k"><span>Place</span> ${escapeHtml(s.place)}</span>
        </div>
      `;

      card.appendChild(thumb);
      card.appendChild(meta);
      card.addEventListener("click", ()=>openModal(it));
      grid.appendChild(card);
    }
  }

  // 讀取 data.json（你後台匯出後放在同資料夾，並改名 data.json）
  try{
    const res = await fetch("./data.json", {cache:"no-store"});
    const data = await res.json();
    items = Array.isArray(data.items) ? data.items : [];
  }catch(e){
    items = [];
  }

  search.addEventListener("input", render);
  mClose.addEventListener("click", closeModal);
  modal.addEventListener("click", (e)=>{ if(e.target===modal) closeModal(); });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });

  render();
})();
</script>
</body>
</html>
